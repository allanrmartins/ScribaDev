[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scribadev"
dynamic = ["version"]
description ="Fork pessoal/local do Scriba: gravação e transcrição automática de reuniões (Teams, Zoom, Meet) — 100% local e privada, com notas em Markdown prontas para usar como contexto de desenvolvimento."
readme = "README.md"
license = "Elastic-2.0"
authors = [{ name = "Allan Martins" }]
requires-python = ">=3.12"
keywords = ["teams", "meeting", "transcription", "whisper", "notes", "recorder", "windows", "linux", "macos"]
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Natural Language :: Portuguese (Brazilian)",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Office/Business",
]
dependencies = [
    # captura WASAPI loopback e toasts WinRT: só existem (e só têm wheel) no Windows.
    # Fora dele o pip os ignora (épico #104); a captura POSIX vem em marcos futuros.
    "pyaudiowpatch==0.2.12.8 ; sys_platform == 'win32'",
    # captura no macOS (#104, M3): data plane PortAudio (sounddevice, MIT) + control
    # plane do process tap (CATapDescription via pyobjc; o resto é ctypes puro)
    "sounddevice>=0.5 ; sys_platform == 'darwin'",
    "pyobjc-framework-CoreAudio ; sys_platform == 'darwin'",
    # títulos de janela p/ detecção no navegador + nome da reunião (#104, M4):
    # AX API (precisa da permissão de Acessibilidade; degrada sem ela)
    "pyobjc-framework-ApplicationServices ; sys_platform == 'darwin'",
    # STT acelerado por Metal no Apple Silicon (#104, M5): provider stt_mlx atrás
    # do make_transcriber; sem ele o local cai no faster-whisper CPU normalmente
    "mlx-whisper ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper==1.2.1",
    "ctranslate2~=4.8",
    # pystray/Pillow saíram em 2026-08 (#104): a bandeja é QSystemTrayIcon desde o
    # corte para Qt (#53) e nada mais importava os dois em runtime (o pystray, LGPL,
    # ainda pesava na auditoria de licenças). Pillow segue só nos tools/ de dev.
    "windows-toasts==1.3.1 ; sys_platform == 'win32'",
    # UI: PySide6 virou dependência principal no corte para Qt (#53); antes era o extra `qt`.
    # 6.7 = piso com High-DPI por padrão + QSS estável.
    "PySide6>=6.7",
    # Timesheet (#122): exporta (e, na fase 2, importa) o xlsx de apontamento.
    # Puro Python (sem DLL — não atrapalha instalador futuro); stdlib não escreve xlsx.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12~=12.9",
    "nvidia-cudnn-cu12~=9.23",
]
# diarização: instale o torch antes (com CUDA, use o índice do PyTorch):
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
diarization = [
    # pin na major 4.x (testada): a API do pyannote já quebrou entre majors
    # (shims em diarize.py) — um 5.x silencioso poderia regredir a diarização (#4).
    "pyannote.audio>=4,<5",
]

[project.urls]
Homepage = "https://github.com/allanrmartins/ScribaDev"
Repository = "https://github.com/allanrmartins/ScribaDev"
Issues = "https://github.com/allanrmartins/ScribaDev/issues"

[project.scripts]
scribadev = "scriba.cli:main"

[project.gui-scripts]
scribadev-tray = "scriba.cli:main_tray"

[tool.setuptools]
# subpacotes listados explicitamente: sem eles um build NÃO-editável (wheel/sdist)
# omitiria scriba.qt/scriba.plat em silêncio (o editable de hoje mascara isso)
packages = ["scriba", "scriba.plat", "scriba.qt"]

# versão = fonte única em scriba/__init__.py (__version__); bump = editar lá só
[tool.setuptools.dynamic]
version = { attr = "scriba.__version__" }

[tool.setuptools.package-data]
scriba = ["assets/*.ico", "assets/*.png"]
